<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BYOS social preview</title>
    <!-- Source of docs/social-preview.png (GitHub social preview, 1280x640). Tokens and grid copied from header.html, the original. -->
    <style>
      :root {
        --bg: #0a0e1a;
        --grid: rgba(255, 255, 255, 0.035);
        --text: #e8ecf2;
        --accent: #a3e635;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1280px;
        height: 640px;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
        position: relative;
        overflow: hidden;
      }
      .bg-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: 40px 40px;
        mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, #000 50%, transparent 100%);
      }
      .glow {
        position: absolute;
        width: 760px;
        height: 760px;
        left: 260px;
        top: -260px;
        background: radial-gradient(circle, #a3e63518, transparent 62%);
      }
      .stage {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      img {
        width: 280px;
        height: 280px;
      }
      h1 {
        margin-top: 4px;
        font-size: 96px;
        font-weight: 800;
        letter-spacing: -0.025em;
        line-height: 1;
      }
      .sub {
        margin-top: 14px;
        font-family: 'SF Mono', 'Menlo', monospace;
        font-size: 26px;
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="bg-grid"></div>
    <div class="glow"></div>
    <div class="stage">
      <img src="../logo.svg" alt="" />
      <h1>BYOS</h1>
      <div class="sub">Bring Your Own Storage</div>
    </div>
  </body>
</html>
