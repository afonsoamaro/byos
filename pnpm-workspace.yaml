packages:
  - packages/*

catalog:
  # typescript-eslint 8.72.2 declares the peer `typescript: >=4.8.4 <6.1.0`.
  # On 7.x typecheck passes but type-aware lint breaks. Revisit when the peer ceiling moves.
  typescript: 6.0.3

allowBuilds:
  # The esbuild binary comes from its platform optional dependency; the postinstall only
  # re-checks it. Denied until the portability test proves esbuild can't start without it.
  esbuild: false

overrides:
  # GHSA-g3hv-75wg-m249: typescript-estree pins minimatch ^10; drops out once the parent moves to >=11.0.1.
  'minimatch@<11.0.1': ^11.0.1
